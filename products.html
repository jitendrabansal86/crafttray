<!doctype html>

<body>
  <header class="site-header">

        <img src="images/crafttray-logo.png" alt="CraftTray Logo">

         <!--  <p>Short description of the product and its key benefit.</p> -->

          <!-- <p>Short description of the product and its key benefit.</p> -->
        </article>
        <article class="product-card" data-category="utility">

         <!--  <p>Short description of the product and its key benefit.</p> -->

        <article class="product-card" data-category="utility">

        <article class="product-card" data-category="utility">
          <div class="product-image"><img src="images/wine-towel.png" alt="Towel"></div>

          <h3>Towel (Wine)</h3>
         <!--  <p>Short description of the product and its key benefit.</p> -->
        </article>
        <article class="product-card" data-category="home">
          <div class="product-image"><img src="images/brown-dustbin.png" alt="Dustbin"></div>
          <div class="tag">HOME</div>
          <h3>Dustbin (Brown)</h3>
         <!--  <p>Short description of the product and its key benefit.</p> -->
        </article>
